<style>

<body>
<header>Board Comercial · Carga de dados</header>
<main>
  <div class="card">
    <div id="aviso" class="hidden"></div>
    <div id="area" class="hidden">
      <h2>Atualizar dados</h2>
      <p>Planilhas do UXComex: "Propostas Criadas" (substituem as versões anteriores das propostas) e/ou "Lista Clientes" (substitui a lista inteira).</p>
      <input type="file" id="arquivos" accept=".xlsx,.xls" multiple>
      <button class="btn" id="btnCarregar" type="button">Carregar</button>
      <div class="log" id="log"></div>
      <p id="ultima" style="margin-top:12px"></p>
    </div>
  </div>
</main>
<script>
const sb = supabase.createClient('https://ldoskdmbjwegfytypgfu.supabase.co', 'sb_publishable_zyTWrGpf61rXpapK5fN_zg_zDsZWPeO', { auth: { flowType: 'implicit' } });
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('pt-BR');
async function mostrarUltimaCarga(){
  const { data } = await sb.from('com_cargas').select('carregado_em').order('carregado_em',{ascending:false}).limit(1);
  $('ultima').textContent = data && data.length ? 'Última carga: ' + new Date(data[0].carregado_em).toLocaleString('pt-BR') : '';
}
(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  const aviso = t => { $('aviso').innerHTML = t; $('aviso').classList.remove('hidden'); };
  if (!session) return aviso('Faça login no <a href="./">Board Comercial</a> e depois volte a esta página.');
  const { data } = await sb.from('com_acessos').select('pode_carregar').maybeSingle();
  if (!data || !data.pode_carregar) return aviso('Seu usuário não tem permissão para carregar dados.');
  $('area').classList.remove('hidden'); mostrarUltimaCarga();
})();
/* ---------- Carga de planilhas (somente quem tem permissão) ---------- */
const MAPA = {
  'Número Proposta':'numero_proposta','Tipo Embarque':'tipo_embarque','Produto':'produto',
  'Data Solicitação Cliente':'data_solicitacao_cliente','Tipo de Carga':'tipo_carga','Data de Emissão':'data_emissao',
  'Data de Validade':'data_validade','Status':'status','Motivo':'motivo','Complemento Motivo Proposta':'complemento_motivo',
  'Data de Aprovação':'data_aprovacao','Cliente':'cliente','Ref. Cliente':'ref_cliente','Cia / Armador / Coloader':'cia_armador_coloader',
  'Frete Master':'frete_master','Frete House':'frete_house','Vendedor':'vendedor','País':'pais','Origem':'origem','Destino':'destino',
  'Incoterm':'incoterm','Profit BRL':'profit_brl','Data Criação':'data_criacao','Emissor':'emissor','Inside Sales':'inside_sales',
  'Rota':'rota','Agente Internacional':'agente_internacional','Peso Bruto':'peso_bruto','Peso Taxado/Cubado':'peso_taxado',
  'qtd. containers':'qtd_containers','Custo BRL':'custo_brl','Venda BRL':'venda_brl','Observações da Rota':'observacoes_rota'
};
const DATAS = new Set(['data_solicitacao_cliente','data_emissao','data_validade','data_aprovacao','data_criacao',
                       'data_ativacao_prospecto','data_ultima_proposta','ultimo_embarque']);
const NUMS  = new Set(['profit_brl','peso_bruto','peso_taxado','qtd_containers','custo_brl','venda_brl','ativo_em_dias','dias_sem_embarcar']);
const MAPA_CLI = {
  'Nome Completo':'nome_completo','Apelido':'apelido','CNPJ / CPF':'cnpj','Segmento':'segmento','Vendedor':'vendedor',
  'Inside':'inside','Cidade':'cidade','UF':'uf','Data Ativação Prospecto':'data_ativacao_prospecto',
  'Ativo em (dias)':'ativo_em_dias','Dias sem embarcar':'dias_sem_embarcar',
  'Data de Emissão Última Proposta':'data_ultima_proposta','Último Embarque':'ultimo_embarque','Data de Criação':'data_criacao'
};
const p2 = n => String(n).padStart(2,'0');

function dataISO(v){
  if (v === null || v === undefined || v === '' || v === 0 || v === '0') return null;
  if (typeof v === 'number'){                       // número serial do Excel
    const d = new Date(Math.round((v - 25569) * 86400000));
    return `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())}T${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:00`;
  }
  const m = String(v).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if (!m) return null;
  return `${m[3]}-${p2(m[2])}-${p2(m[1])}T${p2(m[4]||0)}:${m[5]||'00'}:00`;
}
function numero(v){
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v;
  let s = String(v).trim();
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');   // formato 1.234,56
  const n = Number(s); return isNaN(n) ? null : n;
}
function texto(v){
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  return (s === '' || s === '0') ? null : s;
}
function converter(bruto, mapa){
  return bruto.map(r=>{
    const o = {};
    for (const [col, campo] of Object.entries(mapa)){
      const v = r[col];
      o[campo] = DATAS.has(campo) ? dataISO(v) : NUMS.has(campo) ? numero(v) : texto(v);
    }
    if (o.data_validade) o.data_validade = o.data_validade.slice(0,10);
    if (o.ativo_em_dias != null) o.ativo_em_dias = Math.round(o.ativo_em_dias);
    if (o.dias_sem_embarcar != null) o.dias_sem_embarcar = Math.round(o.dias_sem_embarcar);
    return o;
  });
}
function log(t){ const l=$('log'); l.classList.remove('hidden'); l.textContent += t + '\n'; l.scrollTop = l.scrollHeight; }

$('btnCarregar').onclick = async ()=>{
  const arquivos = [...$('arquivos').files];
  $('log').textContent = '';
  if (!arquivos.length){ log('Selecione ao menos uma planilha.'); return; }
  $('btnCarregar').disabled = true;
  try{
    for (const arq of arquivos){
      log(`▶ ${arq.name}`);
      const wb = XLSX.read(await arq.arrayBuffer(), { type:'array' });
      const bruto = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:null, raw:true });
      const cab = bruto.length ? Object.keys(bruto[0]) : [];

      if (cab.includes('Número Proposta')){
        const linhas = converter(bruto, MAPA).filter(o => o.numero_proposta);
        const grupos = {};
        linhas.forEach(l => (grupos[l.numero_proposta] ||= []).push(l));
        const chaves = Object.keys(grupos);
        const LOTE = 250; let total = 0;
        for (let i=0; i<chaves.length; i+=LOTE){
          const lote = chaves.slice(i, i+LOTE).flatMap(k => grupos[k]);
          const { data, error } = await sb.rpc('com_carregar', { p_arquivo: arq.name, p_linhas: lote });
          if (error) throw new Error(error.message);
          total += data;
        }
        log(`  ✔ Propostas: ${fmt(chaves.length)} propostas / ${fmt(total)} rotas`);
      } else if (cab.includes('Nome Completo') && cab.includes('Data Ativação Prospecto')){
        const linhas = converter(bruto, MAPA_CLI).filter(o => o.nome_completo);
        const { data, error } = await sb.rpc('com_carregar_clientes', { p_arquivo: arq.name, p_linhas: linhas });
        if (error) throw new Error(error.message);
        log(`  ✔ Clientes: ${fmt(data)} registros (lista substituída)`);
      } else {
        log('  ⚠ Planilha não reconhecida (esperado "Propostas Criadas" ou "Lista Clientes") — ignorada');
      }
    }
    log('Concluído.');
    await mostrarUltimaCarga();
  }catch(e){ log('✖ Erro: ' + e.message); }
  $('btnCarregar').disabled = false;
};

</script>
</body>
</html>
